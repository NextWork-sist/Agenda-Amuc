<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda AMUC - Reservas</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">AMUC</div>
        <div><strong>Agenda AMUC</strong><span id="userRole">Usuario</span></div>
      </div>
      <nav class="nav-menu">
        <a href="dashboard.html">Inicio</a>
        <a href="reservas.html" class="active">Reservas</a>
        <a href="clientes.html">Clientes</a>
        <a href="pagos.html">Cobros</a>
      </nav>
      <button id="logoutBtn" class="btn btn-ghost">Cerrar sesión</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div><h1>Reservas</h1><p>Alta y seguimiento de eventos.</p></div>
        <button id="toggleFormBtn" class="btn btn-primary">Nueva reserva</button>
      </header>

      <section id="reservaFormPanel" class="panel hidden">
        <div class="panel-header"><h2>Nueva reserva</h2></div>
        <form id="reservaForm" class="form-grid">
          <label>Cliente
            <select id="cliente_id" required></select>
          </label>
          <label>Fecha
            <input type="date" id="fecha" required>
          </label>
          <label>Hora inicio
            <input type="time" id="hora_inicio">
          </label>
          <label>Hora fin
            <input type="time" id="hora_fin">
          </label>
          <label>Tipo de evento
            <input type="text" id="tipo_evento" placeholder="Cumpleaños, casamiento...">
          </label>
          <label>Cantidad de personas
            <input type="number" id="cantidad_personas" min="0">
          </label>
          <label>Valor total
            <input type="number" id="valor_total" min="0" step="0.01">
          </label>
          <label>Estado
            <select id="estado">
              <option value="PRE_RESERVA">Pre-reserva</option>
              <option value="CONFIRMADA">Confirmada</option>
              <option value="CANCELADA">Cancelada</option>
              <option value="REALIZADA">Realizada</option>
              <option value="CERRADA">Cerrada</option>
            </select>
          </label>
          <label class="full">Observaciones
            <textarea id="observaciones" rows="3"></textarea>
          </label>
          <div class="full form-actions">
            <button type="submit" class="btn btn-primary">Guardar reserva</button>
            <span id="reservaMessage" class="form-message"></span>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header"><h2>Reservas registradas</h2></div>
        <div id="reservasTable" class="table-wrap"><p class="muted">Cargando...</p></div>
      </section>
    </main>
  </div>

  <script src="../js/supabase.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/reservas.js"></script>
</body>
</html>
